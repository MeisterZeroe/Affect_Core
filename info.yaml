# Tiny Tapeout project information
project:
  title:        "Echoes Affect Core"
  author:       "Jason Ballard / Evil Company Ink."
  discord:      ""
  description:  "Hardware emotional core for the Echoes companion robot"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies
  tiles: "1x1"

  # Top module name must start with "tt_um_"
  top_module:  "tt_um_eci_affect_core"

  # Source files live in ./src, one per line
  source_files:
    - "project.v"
    - "affect_spi.v"

# The pinout of your project. Do not delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SPI_SCK"
  ui[1]: "SPI_MOSI"
  ui[2]: "SPI_CS_N"
  ui[3]: "TEST_MODE"
  ui[4]: "REFLEX_LOUD"
  ui[5]: "REFLEX_TOUCH"
  ui[6]: "REFLEX_MOTION"
  ui[7]: "REFLEX_TILT"

  # Outputs
  uo[0]: "SPI_MISO"
  uo[1]: "PWM_INTENSITY"
  uo[2]: "MOOD[0]"
  uo[3]: "MOOD[1]"
  uo[4]: "MOOD[2]"
  uo[5]: "MOOD[3]"
  uo[6]: "MOOD_IRQ"
  uo[7]: "HEARTBEAT"

  # Bidirectional pins
  uio[0]: "DEBUG[0]"
  uio[1]: "DEBUG[1]"
  uio[2]: "DEBUG[2]"
  uio[3]: "DEBUG[3]"
  uio[4]: "DEBUG[4]"
  uio[5]: "DEBUG[5]"
  uio[6]: "DEBUG[6]"
  uio[7]: "DEBUG[7]"

# Do not change!
yaml_version: 6
