# Tiny Tapeout project information
project:
  title:        "Echoes Affect Core"
  author:       "Jason Ballard / Evil Company Ink."
  discord:      ""
  description:  "Hardware emotional core for the Echoes companion robot"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_eci_affect_core"

  # List your project's source files here. Source files must be in ./src
  # and you must list each source file separately, one per line.
  source_files:
    - "project.v"
    - "affect_spi.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "SPI_SCK"
  ui[1]: "SPI_MOSI"
  ui[2]: "SPI_CS_N"
  ui[3]: "TEST_MODE"
  ui[4]: "REFLEX_LOUD"
  ui[5]: "REFLEX_TOUCH"
  ui[6]: "REFLEX_MOTION"
  ui[7]: "REFLEX_TILT"

  # Outputs
  uo[0]: "SPI_MISO"
  uo[1]: "PWM_INTENSITY"
  uo[2]: "MOOD_0"
  uo[3]: "MOOD_1"
  uo[4]: "MOOD_2"
  uo[5]: "MOOD_3"
  uo[6]: "MOOD_IRQ"
  uo[7]: "HEARTBEAT"

  # Bidirectional pins
  uio[0]: "DEBUG_0"
  uio[1]: "DEBUG_1"
  uio[2]: "DEBUG_2"
  uio[3]: "DEBUG_3"
  uio[4]: "DEBUG_4"
  uio[5]: "DEBUG_5"
  uio[6]: "DEBUG_6"
  uio[7]: "DEBUG_7"

# Do not change!
yaml_version: 6
